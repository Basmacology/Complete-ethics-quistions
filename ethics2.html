<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Ethics — Interactive Exam Practice</title>
    <!-- Google Fonts: ADLaM Display & Plus Jakarta Sans for fallback/accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(20, 29, 47, 0.72);
            --bg-card-hover: rgba(30, 43, 68, 0.88);
            --border-color: rgba(99, 102, 241, 0.22);
            --border-hover: rgba(56, 189, 248, 0.55);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-emerald: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-glow: 0 10px 30px -10px rgba(56, 189, 248, 0.25);
        }

        [data-theme="light"] {
            --bg-dark: #f0f4f8;
            --bg-card: rgba(255, 255, 255, 0.88);
            --bg-card-hover: rgba(255, 255, 255, 1);
            --border-color: rgba(148, 163, 184, 0.35);
            --border-hover: rgba(2, 132, 199, 0.6);
            --accent-primary: #0284c7;
            --accent-secondary: #4f46e5;
            --accent-emerald: #059669;
            --text-main: #0f172a;
            --text-muted: #475569;
            --shadow-glow: 0 12px 28px -8px rgba(2, 132, 199, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'ADLaM Display', 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.12) 0px, transparent 45%),
                radial-gradient(at 90% 20%, rgba(129, 140, 248, 0.12) 0px, transparent 45%),
                radial-gradient(at 50% 90%, rgba(52, 211, 153, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            padding-bottom: 5rem;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        /* Sticky Top Control Bar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(9, 13, 22, 0.78);
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 1.5rem;
            transition: background 0.35s ease;
        }

        [data-theme="light"] .navbar {
            background: rgba(240, 244, 248, 0.85);
        }

        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.35);
        }

        .brand-title {
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--text-main), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'ADLaM Display', sans-serif;
            border: none;
            cursor: pointer;
            padding: 0.65rem 1.25rem;
            border-radius: 999px;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(56, 189, 248, 0.45);
        }

        .btn-primary.active-all {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.35);
        }

        .btn-icon {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.65rem 0.95rem;
        }

        .btn-icon:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        /* Progress Bar */
        .progress-bar-wrap {
            width: 100%;
            height: 4px;
            background: rgba(148, 163, 184, 0.15);
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-emerald));
            transition: width 0.35s ease;
        }

        /* Hero Header */
        .hero {
            max-width: 1200px;
            margin: 2.5rem auto 1.5rem;
            padding: 0 1.5rem;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-size: 0.82rem;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 1rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 0.6rem;
            letter-spacing: 0.5px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 680px;
            margin: 0 auto 1.5rem;
        }

        /* Stats Strip */
        .stats-strip {
            display: inline-flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.75rem 1.75rem;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-glow);
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.92rem;
        }

        .stat-num {
            color: var(--accent-primary);
            font-size: 1.15rem;
        }

        /* Chapter Filter Pills */
        .chapter-tabs {
            max-width: 1200px;
            margin: 1.8rem auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
        }

        .tab-btn {
            font-family: 'ADLaM Display', sans-serif;
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.55rem 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        /* Main Container & Sections */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .chapter-section {
            margin-bottom: 2.8rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chapter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-title-wrap {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .chapter-badge {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            padding: 0.3rem 0.85rem;
            border-radius: 8px;
            font-size: 0.82rem;
        }

        .chapter-title {
            font-size: 1.35rem;
            color: var(--text-main);
        }

        .chapter-toggle-btn {
            font-family: 'ADLaM Display', sans-serif;
            background: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s ease;
        }

        .chapter-toggle-btn:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--accent-primary);
        }

        /* Questions Grid */
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.15rem;
        }

        /* Question Card */
        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.35rem 1.4rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            backdrop-filter: blur(10px);
        }

        .q-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0.4;
            transition: opacity 0.25s ease, background 0.25s ease;
        }

        .q-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow);
        }

        .q-card:hover::before {
            opacity: 1;
        }

        .q-card.revealed {
            border-color: rgba(52, 211, 153, 0.55);
            background: linear-gradient(145deg, var(--bg-card), rgba(16, 185, 129, 0.08));
        }

        .q-card.revealed::before {
            opacity: 1;
            background: var(--accent-emerald);
        }

        .q-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .q-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-primary);
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.25);
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .q-card.revealed .q-num {
            background: rgba(52, 211, 153, 0.18);
            color: var(--accent-emerald);
            border-color: rgba(52, 211, 153, 0.4);
        }

        .q-status-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.1);
            transition: all 0.25s ease;
        }

        .q-card.revealed .q-status-hint {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-emerald);
        }

        .q-body {
            font-size: 1.03rem;
            color: var(--text-main);
            line-height: 1.75;
        }

        /* Inline Blank Pill */
        .blank-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            padding: 0.12rem 0.75rem;
            margin: 0 0.25rem;
            border-radius: 8px;
            border-bottom: 2px dashed var(--accent-primary);
            background: rgba(56, 189, 248, 0.08);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            vertical-align: baseline;
        }

        .q-card.revealed .blank-slot {
            border-bottom: 2px solid var(--accent-emerald);
            background: rgba(52, 211, 153, 0.2);
            color: var(--accent-emerald);
            transform: scale(1.03);
            box-shadow: 0 2px 10px rgba(52, 211, 153, 0.2);
        }

        /* Bottom Answer Drawer inside Card */
        .answer-drawer {
            margin-top: 0.25rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .q-card.revealed .answer-drawer {
            max-height: 60px;
            opacity: 1;
        }

        .answer-label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .answer-value {
            color: var(--accent-emerald);
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            display: none;
        }

        @media (max-width: 640px) {
            .navbar-inner {
                flex-direction: column;
                align-items: stretch;
            }
            .controls {
                justify-content: space-between;
            }
            .questions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <div class="brand">
                <div class="brand-icon">⚕️</div>
                <div>
                    <div class="brand-title">MEDICAL ETHICS</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="toggleAllBtn" onclick="toggleAllAnswers()">
                    <span id="toggleAllIcon">👁️</span>
                    <span id="toggleAllText">إظهار كل الإجابات (Show All)</span>
                </button>

                <button class="btn btn-icon" id="themeBtn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                    🌙
                </button>
            </div>
        </div>
    </nav>
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <!-- Hero Section -->
    <header class="hero">
        <span class="hero-badge">Exam Practice • 60 Questions</span>
        <h1>Medical Ethics Interactive Quiz</h1>
        <p>اضغط على أي سؤال لإظهار أو إخفاء إجابته فوراً، أو استخدم الزر العلوي لإظهار جميع الإجابات دفعة واحدة.</p>

        <div class="stats-strip">
            <div class="stat-item">
                <span>Total Questions:</span>
                <span class="stat-num" id="totalCount">60</span>
            </div>
            <div class="stat-item">
                <span>Revealed:</span>
                <span class="stat-num" id="revealedCount">0</span>
            </div>
            <div class="stat-item">
                <span>Chapters:</span>
                <span class="stat-num">1 – 9</span>
            </div>
        </div>
    </header>

    <!-- Chapter Filter Tabs -->
    <div class="chapter-tabs" id="chapterTabs">
        <button class="tab-btn active" onclick="filterChapter('all', this)">All Chapters (60)</button>
        <button class="tab-btn" onclick="filterChapter('ch1-2', this)">Ch 1–2: Core Principles</button>
        <button class="tab-btn" onclick="filterChapter('ch3', this)">Ch 3: Informed Consent</button>
        <button class="tab-btn" onclick="filterChapter('ch4', this)">Ch 4: Confidentiality</button>
        <button class="tab-btn" onclick="filterChapter('ch5-6', this)">Ch 5–6: Professional Duties</button>
        <button class="tab-btn" onclick="filterChapter('ch7-8', this)">Ch 7–8: Genetics & Beginning of Life</button>
        <button class="tab-btn" onclick="filterChapter('ch9', this)">Ch 9: End-of-Life Ethics</button>
    </div>

    <!-- Questions Container -->
    <main class="container" id="quizContainer"></main>
    <div class="empty-state" id="emptyState">No matching questions found. Try another keyword!</div>

    <script>
        const quizData = [
            {
                id: "ch1-2",
                chapterBadge: "Chapters 1–2",
                title: "Core principles and autonomy",
                questions: [
                    { num: "01", prefix: "The four pillars are autonomy, beneficence, non-maleficence and", suffix: ".", answer: "justice" },
                    { num: "02", prefix: "The principle of acting for the benefit of the patient is", suffix: ".", answer: "beneficence" },
                    { num: "03", prefix: "The principle of avoiding harm is", suffix: ".", answer: "non-maleficence" },
                    { num: "04", prefix: "The right of a competent patient to make decisions about their own care is", suffix: ".", answer: "autonomy" },
                    { num: "05", prefix: "Giving everyone the same resources is called", suffix: ".", answer: "equality" },
                    { num: "06", prefix: "Providing support according to individual needs is called", suffix: ".", answer: "equity" },
                    { num: "07", prefix: "The three bases of full autonomy are capacity, voluntariness and adequate information with", suffix: ".", answer: "understanding" },
                    { num: "08", prefix: "A decision made without force or pressure is described as", suffix: ".", answer: "voluntary" },
                    { num: "09", prefix: "The practical tool for respecting autonomy is informed", suffix: ".", answer: "consent" },
                    { num: "10", prefix: 'The traditional approach described as "doctor knows best" is called', suffix: ".", answer: "paternalism" }
                ]
            },
            {
                id: "ch3",
                chapterBadge: "Chapter 3",
                title: "Informed consent",
                questions: [
                    { num: "11", prefix: "Consent inferred from a patient's behavior is called", suffix: "consent.", answer: "implied" },
                    { num: "12", prefix: "Consent clearly given verbally or in writing is called", suffix: "consent.", answer: "expressed (explicit)" },
                    { num: "13", prefix: "Before major operations, consent should be in", suffix: "form.", answer: "written" },
                    { num: "14", prefix: "Consent given by spoken words is called", suffix: "consent.", answer: "oral (verbal)" },
                    { num: "15", prefix: "Valid consent must be informed, competent and", suffix: ".", answer: "voluntary" },
                    { num: "16", prefix: "The ability to understand and reason about a medical decision is called decision-making", suffix: ".", answer: "capacity" },
                    { num: "17", prefix: "For a young child, consent is usually obtained from a parent or legal", suffix: ".", answer: "guardian" },
                    { num: "18", prefix: "Information about treatment should include its benefits, risks and", suffix: ".", answer: "alternatives" },
                    { num: "19", prefix: "A competent patient has the right to", suffix: "treatment.", answer: "refuse" },
                    { num: "20", prefix: "Informed consent is an ongoing process of", suffix: "between the clinician and patient.", answer: "communication" }
                ]
            },
            {
                id: "ch4",
                chapterBadge: "Chapter 4",
                title: "Confidentiality and conflict of interest",
                questions: [
                    { num: "21", prefix: "Keeping identifiable patient information private is called medical", suffix: ".", answer: "confidentiality" },
                    { num: "22", prefix: "The duty of confidentiality continues even after the patient's", suffix: ".", answer: "death" },
                    { num: "23", prefix: "A patient's photographs and recordings are examples of", suffix: "information.", answer: "confidential" },
                    { num: "24", prefix: "Access to medical records should be limited to", suffix: "persons.", answer: "authorized" },
                    { num: "25", prefix: "After using an electronic patient record, staff should", suffix: "of the system.", answer: "log out" },
                    { num: "26", prefix: "Patient data sent by email should be", suffix: ".", answer: "encrypted" },
                    { num: "27", prefix: "A doctor's judgment may be affected by competing personal or financial interests, creating a conflict of", suffix: ".", answer: "interest" },
                    { num: "28", prefix: "Being open about a potential conflict requires transparency and", suffix: ".", answer: "disclosure" },
                    { num: "29", prefix: "When managing a conflict of interest, the patient's well-being should take", suffix: ".", answer: "priority" },
                    { num: "30", prefix: "If disclosure cannot resolve a conflict, the doctor may refer the patient to another healthcare", suffix: ".", answer: "professional" }
                ]
            },
            {
                id: "ch5-6",
                chapterBadge: "Chapters 5–6",
                title: "Responsibility and professional duties",
                questions: [
                    { num: "31", prefix: "The four elements of negligence are duty, breach of duty, damage and", suffix: ".", answer: "causation (causal relationship)" },
                    { num: "32", prefix: "A professional relationship creates a duty of", suffix: "towards the patient.", answer: "care" },
                    { num: "33", prefix: "Failure to meet the accepted standard of care is a", suffix: "of duty.", answer: "breach" },
                    { num: "34", prefix: "A direct link between the medical error and the injury is called", suffix: ".", answer: "causation" },
                    { num: "35", prefix: "Ending necessary medical services without notice is called", suffix: ".", answer: "abandonment" },
                    { num: "36", prefix: "Injury, financial loss, and pain or suffering are forms of", suffix: ".", answer: "damage (damages)" },
                    { num: "37", prefix: "Other medical professionals may testify about the standard of care as expert", suffix: ".", answer: "witnesses" },
                    { num: "38", prefix: "A doctor who recognizes that a case is beyond their competence should seek specialist", suffix: ".", answer: "advice (consultation)" },
                    { num: "39", prefix: "Clinical decisions should be based on up-to-date", suffix: "information.", answer: "scientific" },
                    { num: "40", prefix: "Medical students should respect human life and", suffix: ".", answer: "dignity" }
                ]
            },
            {
                id: "ch7-8",
                chapterBadge: "Chapters 7–8",
                title: "Genetics and the beginning of life",
                questions: [
                    { num: "41", prefix: "Treatment that alters genes to correct disease is called gene", suffix: ".", answer: "therapy" },
                    { num: "42", prefix: "Gene therapy involving eggs or sperm is called", suffix: "gene therapy.", answer: "germline" },
                    { num: "43", prefix: "Gene therapy targeting non-reproductive body cells is called", suffix: "gene therapy.", answer: "somatic" },
                    { num: "44", prefix: "Changes made by germline gene therapy may be passed to future", suffix: ".", answer: "generations" },
                    { num: "45", prefix: "Changes made by somatic gene therapy are not passed to the patient's", suffix: ".", answer: "children (offspring)" },
                    { num: "46", prefix: "In the textbook, alteration intended to enhance capabilities beyond normal is called genetic", suffix: ".", answer: "engineering" },
                    { num: "47", prefix: "A conflict between the pregnant woman's wishes and treatment recommended for the fetus is a", suffix: "conflict.", answer: "maternal-fetal" },
                    { num: "48", prefix: "A capable pregnant woman retains her right to bodily integrity and", suffix: ".", answer: "autonomy" },
                    { num: "49", prefix: "A spontaneous pregnancy loss is also called a", suffix: ".", answer: "miscarriage" },

                themeBtn.textContent = '🌙';

        }
